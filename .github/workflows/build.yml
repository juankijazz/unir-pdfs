name: Build exe
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m PyInstaller --onefile --windowed --name unir_pdfs unir_pdfs.py
      - uses: actions/upload-artifact@v4
        with:
          name: unir_pdfs
          path: dist/unir_pdfs.exe
